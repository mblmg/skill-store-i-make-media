# Holt täglich den aktuellen Stand der gespiegelten Skills.
# Bei Änderungen: Dateien ersetzen, committen, pushen.
# Der Push auf main löst dann den Sync in claude.ai aus.
name: Upstream-Skills synchronisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch: {}     # manuell über "Run workflow"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # be-ambitious: nur SKILL.md und LICENSE. Das Original hat keine
      # Versionsnummer, deshalb zählen wir unsere eigene hoch.
      - name: be-ambitious
        env:
          UPSTREAM: https://github.com/robonuggets/be-ambitious.git
          PLUGIN_DIR: plugins/be-ambitious
          SKILL_DIR: plugins/be-ambitious/skills/be-ambitious
        run: |
          git clone --depth 1 "$UPSTREAM" /tmp/be-ambitious
          SHA=$(git -C /tmp/be-ambitious rev-parse HEAD)
          cp /tmp/be-ambitious/SKILL.md "$SKILL_DIR/SKILL.md"
          cp /tmp/be-ambitious/LICENSE  "$SKILL_DIR/LICENSE"
          if git diff --quiet -- "$SKILL_DIR"; then
            echo "be-ambitious: keine Änderungen."
            exit 0
          fi
          OLD_VERSION=$(jq -r .version "$PLUGIN_DIR/.claude-plugin/plugin.json")
          # Letzte Stelle hochzählen: 1.0.0 -> 1.0.1
          NEW_VERSION=$(echo "$OLD_VERSION" | awk -F. '{print $1"."$2"."$3+1}')
          jq --arg v "$NEW_VERSION" '.version = $v' \
            "$PLUGIN_DIR/.claude-plugin/plugin.json" > /tmp/plugin.json
          mv /tmp/plugin.json "$PLUGIN_DIR/.claude-plugin/plugin.json"
          # Original-Stand nur in der Commit-Nachricht festhalten,
          # claude.ai warnt bei unbekannten Feldern in plugin.json.
          echo "be-ambitious $NEW_VERSION (Original ${SHA:0:7})" >> /tmp/changes.txt

      # humanizer-de: das ganze Repo ist das Plugin. Der Autor pflegt die
      # Versionsnummer selbst, wir übernehmen sie unverändert.
      # Weggelassen: .git, seine GitHub-Abläufe und seine Marktplatz-Datei.
      - name: humanizer-de
        env:
          UPSTREAM: https://github.com/marmbiz/humanizer-de.git
          PLUGIN_DIR: plugins/humanizer-de
        run: |
          git clone --depth 1 "$UPSTREAM" /tmp/humanizer-de
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude-plugin/marketplace.json' \
            /tmp/humanizer-de/ "$PLUGIN_DIR/"
          git add -A -f -- "$PLUGIN_DIR"
          if git diff --cached --quiet -- "$PLUGIN_DIR"; then
            echo "humanizer-de: keine Änderungen."
            exit 0
          fi
          VERSION=$(jq -r .version "$PLUGIN_DIR/.claude-plugin/plugin.json")
          echo "humanizer-de $VERSION" >> /tmp/changes.txt

      - name: Committen und pushen
        run: |
          if [ ! -s /tmp/changes.txt ]; then
            echo "Nichts zu tun."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upstream-Sync: $(paste -sd ', ' /tmp/changes.txt)"
          git push
